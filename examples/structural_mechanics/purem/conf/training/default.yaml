defaults:
  - base_training   # Hydra structured config schema (structured_configs.py)

raw_data_dir: ???               # Required: set via experiment config
raw_data_dir_validation: ???    # Required: set via experiment config
global_features_filepath: null  # Optional: path to global_features.json
max_workers_preprocessing: 64

optimizer: adam
optimizer_weight_decay: 0.0001

num_time_steps: ???             # Required: set via experiment config (21 for Purem)
num_training_samples: ???       # Required: set via experiment config
num_validation_samples: 0
start_lr: 0.0001
end_lr: 0.0000003
epochs: 10000
validation_freq: 10
save_checkpoint_freq: 10

amp: True
use_apex: True
num_dataloader_workers: 4      # Reduced from 8; Zarr IO is fast

ckpt_path: "./checkpoints"

# MLflow experiment tracking
mlflow_tracking_uri: null       # null = auto: <project_root>/mlruns/
mlflow_run_name: null           # null = experiment_name
mlflow_run_group: null          # logical grouping tag, e.g. "ablation_v1"
