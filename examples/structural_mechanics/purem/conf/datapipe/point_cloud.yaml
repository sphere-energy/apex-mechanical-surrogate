_target_: datapipe.CrashPointCloudDataset
_convert_: all
data_dir: ${training.raw_data_dir}
global_features_filepath: ${training.global_features_filepath}
num_samples: ${training.num_training_samples}
num_steps: ${training.num_time_steps}
sample_type: all_time_steps

static_features: [thickness]
dynamic_features: []
dynamic_targets: []      # extend to [von_mises] or [S11, S22, S12, von_mises] when ready
global_features: null    # extend to [width_mm, height_mm, ...] for multi-variant training
stats_dir: stats
dt: 0.025                # 25 ms field-output interval
